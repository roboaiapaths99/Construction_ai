<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #0f172a;
    }
    .wrap {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    .sidebar h2 {
      margin-top: 0;
    }
    .sidebar a {
      display: block;
      color: #cbd5e1;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .sidebar a:hover {
      background: #1e293b;
      color: white;
    }
    .main {
      flex: 1;
      padding: 24px;
    }
    .topbar {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }
    .label {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .value {
      font-size: 32px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sidebar">
      <h2>Construction AI</h2>
      <a href="#">Dashboard</a>
      <a href="#">Violations</a>
      <a href="#">Workers</a>
      <a href="#">Alerts</a>
      <a href="#">Cameras</a>
    </div>

    <div class="main">
      <div class="topbar">
        <h1>Construction AI Dashboard</h1>
        <p>Frontend is working.</p>
      </div>

      <div class="cards">
        <div class="card">
          <div class="label">Total Workers</div>
          <div class="value">12</div>
        </div>
        <div class="card">
          <div class="label">Violations</div>
          <div class="value">5</div>
        </div>
        <div class="card">
          <div class="label">Alerts</div>
          <div class="value">3</div>
        </div>
        <div class="card">
          <div class="label">Cameras</div>
          <div class="value">4</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
